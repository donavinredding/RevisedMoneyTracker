<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONEY TRACKER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="storageWarningBanner" class="storage-warning-banner" style="display:none;">
    <span>⚠ Storage <span class="storage-pct">0%</span> full — <span class="storage-used">0 MB</span></span>
    <button onclick="app.openSettingsModal('storage')">Manage</button>
    <button onclick="app.openStorageFullModal()">Trim</button>
    <button onclick="app.dismissStorageBanner()">✕</button>
  </div>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linejoin="round">
          <polygon points="12 2 2 12 12 22 22 12 12 2"></polygon>
        </svg>
        <span>MONEY TRACKER</span>
      </div>

      <nav class="sidebar-nav" id="tabStrip">
        <button class="nav-item active" data-tab="checking">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
          </svg>
          <span class="nav-label">Checking</span>
        </button>
        <button class="nav-item" data-tab="savings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18" />
            <path d="M5 21V10l7-5 7 5v11" />
            <path d="M9 21v-6h6v6" />
          </svg>
          <span class="nav-label">Savings</span>
        </button>
        <button class="nav-item" data-tab="networth">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10" />
            <line x1="18" y1="20" x2="18" y2="4" />
            <line x1="6" y1="20" x2="6" y2="16" />
          </svg>
          <span class="nav-label">Net Worth</span>
        </button>
        <button class="nav-item" data-tab="debts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
            <polyline points="16 17 22 17 22 11" />
          </svg>
          <span class="nav-label">Debt Payoff</span>
        </button>
        <button class="nav-item" data-tab="paycheck">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <line x1="8" y1="7" x2="16" y2="7" />
            <circle cx="8" cy="12" r="1" />
            <circle cx="12" cy="12" r="1" />
            <circle cx="16" cy="12" r="1" />
            <circle cx="8" cy="16" r="1" />
            <circle cx="12" cy="16" r="1" />
            <circle cx="16" cy="16" r="1" />
          </svg>
          <span class="nav-label">Paycheck Calc</span>
        </button>
        <button class="nav-item" data-tab="calendar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span class="nav-label">Calendar</span>
        </button>
        <button class="nav-item" data-tab="forecaster">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
            <polyline points="16 7 22 7 22 13" />
          </svg>
          <span class="nav-label">Forecaster</span>
        </button>
        <button class="nav-item" data-tab="apy">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="2" />
          </svg>
          <span class="nav-label">APY Simulator</span>
        </button>
      </nav>
    </aside>

    <div class="main-area">
      <header class="main-header">
        <div class="main-header-left">
          <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="brand brand-mobile">
            <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linejoin="round">
              <polygon points="12 2 2 12 12 22 22 12 12 2"></polygon>
            </svg>
            <span>MONEY TRACKER</span>
          </div>
        </div>

        <div class="main-header-actions">
          <button class="btn btn-sm" data-action="openSettingsModal">⚙ Settings</button>
          <input type="file" id="jsonInput" accept=".json" style="display:none">
        </div>
      </header>

      <main id="mainContent">
        <!-- Content will be injected by app.js based on the active tab -->
      </main>
    </div>
  </div>

  <div id="modalContainer"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>

</html>
